name: Atualizar perfil visual
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Aguardar o gráfico do GitHub atualizar
        if: github.event_name == 'workflow_dispatch'
        run: sleep 90
      - name: Coletar contribuições públicas
        id: calendar
        run: python scripts/fetch_contributions.py
      - name: Coletar dados públicos dos repositórios
        run: python scripts/fetch_github_content.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/design.py
      - name: Detectar mudanças nos dados ou na arte
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- assets data README.md previa.html PREVIA.png PREVIA-ESCURO.png && [ -z "$(git ls-files --others --exclude-standard assets data README.md previa.html PREVIA.png PREVIA-ESCURO.png)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/prepare_pages.py
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: work/pages
      - name: Publicar imagens antes de atualizar o README
        id: deployment
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
      - name: Salvar atualização
        if: steps.changed.outputs.changed == 'true'
        run: |
          git add assets data README.md previa.html PREVIA.png PREVIA-ESCURO.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar dados públicos do perfil [skip ci]'
          git push
      - name: Resumo da atualização
        if: always()
        env:
          PROFILE_RUN_STATUS: ${{ job.status }}
          PROFILE_EVENT: ${{ github.event_name }}
          PROFILE_CHANGED: ${{ steps.changed.outputs.changed }}
          PROFILE_CALENDAR_STATUS: ${{ steps.calendar.outcome }}
          PROFILE_DEPLOY_STATUS: ${{ steps.deployment.outcome }}
        run: python scripts/run_summary.py
