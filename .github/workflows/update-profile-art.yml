name: Atualizar perfil visual
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [repo-updated]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verificar compatibilidade das dependências
        run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Aguardar o gráfico do GitHub atualizar
        if: github.event_name == 'workflow_dispatch'
        run: sleep 90
      - name: Aguardar o GitHub registrar o push recebido
        if: github.event_name == 'repository_dispatch'
        run: sleep 45
      - name: Coletar contribuições públicas
        id: calendar
        run: python scripts/fetch_contributions.py
      - name: Coletar dados públicos dos repositórios
        run: python scripts/fetch_github_content.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Coletar histórico completo de contribuições e sequências
        run: python scripts/fetch_streak_history.py
      - run: python scripts/design.py
      - name: Detectar mudanças nos dados ou na arte
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- assets data README.md README.en-US.md previa.html preview.en-US.html PREVIA.png PREVIA-ESCURO.png PREVIEW-en-US-light.png PREVIEW-en-US-dark.png && [ -z "$(git ls-files --others --exclude-standard assets data README.md README.en-US.md previa.html preview.en-US.html PREVIA.png PREVIA-ESCURO.png PREVIEW-en-US-light.png PREVIEW-en-US-dark.png)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/prepare_pages.py
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: work/pages
          include-hidden-files: true
      - name: Publicar imagens antes de atualizar o README
        id: deployment
        if: steps.changed.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Salvar atualização
        if: steps.changed.outputs.changed == 'true'
        run: |
          git add assets data README.md README.en-US.md previa.html preview.en-US.html PREVIA.png PREVIA-ESCURO.png PREVIEW-en-US-light.png PREVIEW-en-US-dark.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar dados públicos do perfil [skip ci]'
          git push
      - name: Resumo da atualização
        if: always()
        env:
          PROFILE_RUN_STATUS: ${{ job.status }}
          PROFILE_EVENT: ${{ github.event_name }}
          PROFILE_CHANGED: ${{ steps.changed.outputs.changed }}
          PROFILE_CALENDAR_STATUS: ${{ steps.calendar.outcome }}
          PROFILE_DEPLOY_STATUS: ${{ steps.deployment.outcome }}
        run: python scripts/run_summary.py
